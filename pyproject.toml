[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "carter-kkt-tesseract"
version = "0.1.0"
description = "Differentiable Carter/KKT recurrence on Vulkan"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "numpy>=2.3,<3",
]

[project.optional-dependencies]
training = [
    "torch>=2.6",
]
shader = [
    "matplotlib==3.10.0",
    "numpy==2.5.1",
    "slangpy==0.43.1",
]

[tool.setuptools]
py-modules = [
    "export_hybrid",
    "fit_theory33_basin",
    "hybrid_tesseract",
    "migrate_full_slang",
    "progressive_full_unroll",
    "run_theory33_experiments",
    "run_theory33_hybrid",
    "theory33_experiments",
    "theory33_hybrid",
    "train_hybrid",
    "train_lyapunov_conditioned",
    "visualize_tesseract",
]
