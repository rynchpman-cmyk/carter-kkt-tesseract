name: source integrity

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Validate portable artifacts
        run: python -m unittest tests.test_artifacts -v

      - name: Regenerate baseline Slang
        run: |
          python migrate_full_slang.py \
            --model hybrid_model.json \
            --output /tmp/carter_tesseract_full.slang
          cmp carter_tesseract_full.slang /tmp/carter_tesseract_full.slang

      - name: Regenerate conditioned Slang
        run: |
          python migrate_full_slang.py \
            --model hybrid_model_conditioned.json \
            --output /tmp/carter_tesseract_conditioned.slang
          cmp carter_tesseract_conditioned.slang /tmp/carter_tesseract_conditioned.slang

  theory33:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: python -m pip install "numpy>=2.3,<3"

      - name: Install CPU PyTorch
        run: >-
          python -m pip install
          torch==2.12.1
          --index-url https://download.pytorch.org/whl/cpu

      - name: Validate physical hybrid
        run: >-
          python -m unittest
          tests.test_theory33_hybrid
          tests.test_theory33_experiments
          tests.test_theory33_advanced
          -v

      - name: Regenerate broad-basin controller
        run: python fit_theory33_basin.py

      - name: Run literal physical rollout
        run: >-
          python run_theory33_hybrid.py
          --steps 128
          --characteristic-stride 16
          --basin-points 257
          --basin-characteristic-points 17
          --global-exponent-points 61

  nr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NR runtime dependencies
        run: python -m pip install "numpy>=2.3,<3"

      - name: Validate Tesseract NR backend
        run: >-
          python -m unittest discover
          -s tests/nr
          -p "test_*.py"
          -v

      - name: Run coupled NR smoke evolution
        run: >-
          python run_tesseract_nr.py
          --points 8
          --steps 1
          --dt 1e-5

      - name: Run active frozen-constitutive convergence smoke
        run: >-
          python run_tesseract_nr_convergence.py
          --resolutions 4 8 16
          --final-time 1e-6
